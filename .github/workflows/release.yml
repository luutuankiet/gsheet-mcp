# Copied from google-docs-mcp@2fb4652 .github/workflows/release.yml; the gdoc CLI jobs adapted to the gsheet CLI, the npm publish uses trusted publishing (no token) and skips a version already on npm.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.12'

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) != pyproject.toml ($PKG_VERSION). Bump pyproject.toml before tagging."
            exit 1
          fi

      - name: Install deps
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests/unit/ -q

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the gsheet CLI version matches the tag (released in lockstep)
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CLI_VERSION=$(node -p "require('./cli/package.json').version")
          if [ "$TAG_VERSION" != "$CLI_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) != cli/package.json ($CLI_VERSION). Bump both before tagging."
            exit 1
          fi

      - name: Install CLI deps
        working-directory: cli
        run: npm ci

      - name: Run CLI tests
        working-directory: cli
        run: npm test

      - name: Build sdist + wheel
        run: uv build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Verify release notes file exists
        run: |
          NOTES_FILE="releases/${{ github.ref_name }}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Missing $NOTES_FILE. Every tag needs a hand-written narrative entry."
            echo "::error::Create the file (2-3 lines minimum) before tagging."
            exit 1
          fi
          echo "Found $NOTES_FILE ($(wc -l < $NOTES_FILE) lines)"

      - name: Create GitHub Release from narrative notes file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file "releases/${{ github.ref_name }}.md" \
            dist/*

  npm-publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (trusted publishing needs 11.5.1 or later)
        run: npm install -g npm@latest

      - name: Publish @luutuankiet/gsheet
        working-directory: cli
        run: |
          CLI_VERSION=$(node -p "require('./package.json').version")
          if npm view "@luutuankiet/gsheet@$CLI_VERSION" version >/dev/null 2>&1; then
            echo "@luutuankiet/gsheet@$CLI_VERSION is already on npm; nothing to publish."
            exit 0
          fi
          # No token: npm exchanges this job's OIDC identity for a one-time
          # publish credential. The package's trusted publisher on npmjs.com
          # must name this repo and release.yml, or the publish is refused.
          npm publish --access public
